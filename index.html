<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>喜欢你，不止今天</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;}
        body {
            background: linear-gradient(120deg, #090014, #190030, #090014);
            min-height: 100vh;
            overflow: hidden;
            font-family: "微软雅黑", 楷体, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* 漫天星光 呼吸闪烁 */
        .stars {position: absolute;top:0;left:0;width:100%;height:100%;pointer-events: none;}
        .star {position:absolute;background:#fff;border-radius:50%;animation: twinkle 3s infinite ease-in-out;}
        @keyframes twinkle {0%,100%{opacity:0.4;}50%{opacity:1;}}
        /* 爱心飘落特效 满屏爱心 */
        .hearts {position:absolute;top:0;left:0;width:100%;height:100%;pointer-events: none;z-index: 5;}
        .heart {
            position:absolute;
            color: #ff6699;
            font-size: 16px;
            transform: translateY(0);
            animation: fall linear infinite;
            opacity: 0;
        }
        @keyframes fall {
            0% {transform: translateY(-10px) rotate(0deg); opacity: 1;}
            100% {transform: translateY(105vh) rotate(720deg); opacity: 0;}
        }
        /* 主爱心跳动特效 */
        .main-heart {
            font-size: 150px;
            color: #ff3377;
            margin-bottom: 40px;
            animation: heartBeat 1.2s infinite ease-in-out;
            text-align: center;
        }
        @keyframes heartBeat {0%,100%{transform: scale(1);} 50%{transform: scale(1.15);}}
        /* 核心情话 打字机+渐显特效 */
        .words-box {
            color: #fff;
            text-align: center;
            padding: 0 20px;
            z-index: 10;
        }
        .type-text {
            font-size: 22px;
            line-height: 2.2;
            letter-spacing: 2px;
            color: #ffe6f0;
        }
        .end-text {
            margin-top: 30px;
            font-size: 28px;
            color: #ff3377;
            font-weight: bold;
            letter-spacing: 3px;
        }
        /* 底部温柔提示 */
        .footer {
            position: absolute;
            bottom: 20px;
            color: #ffffff80;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="hearts" id="hearts"></div>
    <div class="words-box">
        <div class="main-heart">❤️</div>
        <div class="type-text" id="typeText"></div>
        <div class="end-text">余生漫漫，只想予你 ❤️</div>
    </div>
    <div class="footer">愿我们岁岁年年，满心欢喜</div>

    <script>
        // 1. 生成漫天闪烁星光
        const stars = document.getElementById('stars');
        for(let i=0; i<260; i++){
            let star = document.createElement('div');
            star.className = 'star';
            star.style.left = `${Math.random()*100}%`;
            star.style.top = `${Math.random()*100}%`;
            star.style.width = `${Math.random()*3 + 1}px`;
            star.style.height = star.style.width;
            star.style.animationDelay = `${Math.random()*5}s`;
            stars.appendChild(star);
        }

        // 2. 生成满屏飘落爱心
        const hearts = document.getElementById('hearts');
        function createHeart() {
            let heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = `${Math.random()*100}%`;
            heart.style.animationDuration = `${Math.random()*8 + 6}s`;
            heart.style.fontSize = `${Math.random()*10 + 12}px`;
            hearts.appendChild(heart);
            setTimeout(()=>{heart.remove()}, 15000);
        }
        setInterval(createHeart, 300);

        // 3. 情话打字机特效 - 重点：在这里修改你想对TA说的表白文案！！！
        const loveWords = "世界很大，人山人海；世界很小，刚好遇见你。从遇见你的那一刻，所有的温柔都有了归期，所有的欢喜都有了意义。我贪恋的人间烟火，不偏不倚，刚好是你。喜欢你，不是一时兴起，而是深思熟虑；想和你，不止朝夕，还有岁岁年年。";
        const typeText = document.getElementById('typeText');
        let index = 0;
        function typing() {
            if(index < loveWords.length) {
                typeText.innerHTML += loveWords.charAt(index);
                index++;
                setTimeout(typing, 200); // 打字速度，数字越小越快，默认50刚刚好
            }
        }
        typing();
    </script>
</body>
</html>
